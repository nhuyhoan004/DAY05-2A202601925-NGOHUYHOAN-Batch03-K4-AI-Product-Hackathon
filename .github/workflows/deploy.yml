name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Di chuyển vào thư mục repo trên EC2
            cd ~/discord-bot || cd ~/app || cd ~/DAY05-2A202601925-NGOHUYHOAN-Batch03-K4-AI-Product-Hackathon
            
            # Kéo code mới nhất từ GitHub
            git pull origin ${{ github.ref_name }}
            
            # Build lại image và restart container
            docker compose down
            docker compose up -d --build
            
            # Xóa các Docker image/build cache cũ để giải phóng dung lượng ổ đĩa EC2
            docker image prune -f
